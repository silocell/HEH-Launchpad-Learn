    var ans = x[2].slice(1).split("|");
    return { type:"text", q:x[1], a:ans[0], accept:ans.slice(1), shown:ans[0].charAt(0).toUpperCase() + ans[0].slice(1), why:x[3], skill:tp[0], lead:"Type the answer.", ph:"Type the key word" };
  }
  return { type:"mc", q:x[1], a:x[2], opts:Kit.shuffle(r, x.slice(2, 6)), why:x[6], skill:tp[0] };
}
function weekNo(id){ return Math.round(new Date(id).getTime() / 6048e5); }

    tasks.push({ key: "mix", code: "R", title: "Recap: everything", sub: "8 questions from any topic", items: mix.map(function(q){ return { t: Q[q][0], q: q, s: Math.floor(r() * 1e9) }; }) });
    return tasks;
  },
  make: make,
  practice: ORDER.map(function(k){ return { key: k, title: TOPICS[k][0], icon: TOPICS[k][1], sub: TOPICS[k][2] + " · " + byTopic[k].length + " questions", n: Math.min(10, byTopic[k].length),

});
